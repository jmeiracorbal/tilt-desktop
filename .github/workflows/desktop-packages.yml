name: Desktop packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            archive: TiltDesktop-linux-amd64.tar.xz
            checker: tilt-desktop-check
          - target: macos-arm64
            runner: macos-15
            goos: darwin
            archive: TiltDesktop-macos-arm64.zip
            checker: tilt-desktop-check
          - target: macos-amd64
            runner: macos-15-intel
            goos: darwin
            archive: TiltDesktop-macos-amd64.zip
            checker: tilt-desktop-check
          - target: windows-amd64
            runner: windows-2025
            goos: windows
            archive: TiltDesktop-windows-amd64.zip
            checker: tilt-desktop-check.exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Native Linux graphical build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libegl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev

      - name: Configure Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Verify Go source and dependencies
        run: go test -tags ci -count=1 ./...

      - name: Build headless installer preflight
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o ${{ matrix.checker }} ./cmd/tilt-desktop-check

      - name: Install pinned Fyne packaging tool
        run: go install fyne.io/tools/cmd/fyne@v1.7.4

      - name: Add Fyne tool to PATH on Unix
        if: runner.os != 'Windows'
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Add Fyne tool to PATH on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"$(go env GOPATH)\bin" >> $env:GITHUB_PATH'

      - name: Native desktop packaging
        run: fyne package -os ${{ matrix.goos }} -src ./cmd/tilt-desktop -name TiltDesktop -app-id dev.tilt-desktop

      - name: Archive Linux desktop package
        if: runner.os == 'Linux'
        run: mv TiltDesktop.tar.xz ${{ matrix.archive }}

      - name: Archive macOS app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent TiltDesktop.app ${{ matrix.archive }}

      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path cmd/tilt-desktop/TiltDesktop.exe -DestinationPath ${{ matrix.archive }}

      - name: Upload native desktop package
        uses: actions/upload-artifact@v4
        with:
          name: tilt-desktop-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.checker }}
          if-no-files-found: error
          retention-days: 14

  release-assets:
    name: Verify release assets
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: tilt-desktop-*
          path: packages

      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          for target in linux-amd64 macos-arm64 macos-amd64 windows-amd64; do
            case "$target" in
              linux-amd64) archive="TiltDesktop-$target.tar.xz"; checker=tilt-desktop-check; suffix='' ;;
              windows-amd64) archive="TiltDesktop-$target.zip"; checker=tilt-desktop-check.exe; suffix='.exe' ;;
              macos-*) archive="TiltDesktop-$target.zip"; checker=tilt-desktop-check; suffix='' ;;
            esac
            test -s "packages/tilt-desktop-$target/$archive"
            test -s "packages/tilt-desktop-$target/$checker"
            cp -- "packages/tilt-desktop-$target/$archive" "release/$archive"
            cp -- "packages/tilt-desktop-$target/$checker" "release/tilt-desktop-check-$target$suffix"
          done

      - name: Generate and verify SHA-256 manifest
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -- TiltDesktop-* tilt-desktop-check-* > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 8
          sha256sum --strict --check SHA256SUMS

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: tilt-desktop-release-assets
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tagged release
    needs: release-assets
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: tilt-desktop-release-assets
          path: release

      - name: Verify assets before publication
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < SHA256SUMS)" -eq 8
          sha256sum --strict --check SHA256SUMS

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" release/TiltDesktop-* release/tilt-desktop-check-* release/SHA256SUMS \
            --verify-tag --title "Tilt Desktop $GITHUB_REF_NAME" --generate-notes \
            --notes "Native builds are unsigned and not notarized. Docker, k3d and Tilt must be installed separately." \
            "${flags[@]}"
