name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Native Fyne build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libegl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev xvfb xauth
      - name: Verify Go module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Unit and headless GUI tests
        run: go test -tags ci -count=1 ./...
      - name: Application and environment race detection
        run: go test -race -count=1 ./internal/application ./internal/environment
      - name: Vet
        run: go vet -tags ci ./...
      - name: Build native Linux desktop
        run: go build -o /tmp/tilt-desktop ./cmd/tilt-desktop
      - name: Smoke test desktop with a virtual display
        run: |
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
          display_pid=$!
          trap 'kill "$display_pid" 2>/dev/null || true; wait "$display_pid" 2>/dev/null || true' EXIT
          sleep 2
          kill -0 "$display_pid"
          set +e
          DISPLAY=:99 timeout --signal=TERM --kill-after=2s 8s /tmp/tilt-desktop
          result=$?
          set -e
          if [ "$result" -ne 124 ]; then
            echo "Desktop did not remain running until the smoke-test timeout (exit: $result)."
            exit 1
          fi
